name: CI - lint

on:
  pull_request:
    branches: [main]
    paths:
      - "real_estate_analysis/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-lint.yml"
  workflow_dispatch:

concurrency:
  group: dbt-ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .
  DBT_TARGET: ci

defaults:
  run:
    working-directory: real_estate_analysis

jobs:
  lint:
    name: SQL lint (SQLFluff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Le templater dbt de SQLFluff a besoin des packages
      - name: dbt deps
        run: dbt deps

      # On ne lint que les fichiers SQL modifiés dans la PR.
      # --relative : chemins relatifs au dossier courant (real_estate_analysis/)
      - name: Lint changed SQL files
        run: |
          git diff -z --name-only --relative --diff-filter=ACMR \
            origin/${{ github.base_ref }}...HEAD -- 'models/*.sql' 'tests/*.sql' > changed.txt
          if [ ! -s changed.txt ]; then
            echo "Aucun fichier SQL modifié, lint ignoré."
            exit 0
          fi
          xargs -0 sqlfluff lint --format github-annotation-native < changed.txts