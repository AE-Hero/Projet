name: 🗓️ Orchestration Preprod - dbt run daily

# Chaque jour, dbt tourne sur la base preprod (modèles, tests, Elementary),
# puis la base mise à jour est republiée dans la release db-preprod.
# Les résultats des tests et d'Elementary sont dans la base (schéma *_elementary).

on:
  schedule:
    - cron: "17 5 * * *" # tous les jours à 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write # republier la base dans la release

# Même groupe que le déploiement preprod, pour ne jamais modifier la base en même temps
concurrency:
  group: preprod-db
  cancel-in-progress: false

jobs:
  dbt-daily:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DBT_TARGET: preprod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Télécharger la base preprod
        run: gh release download db-preprod --pattern preprod.duckdb --dir real_estate_analysis

      - name: dbt build (modèles, tests, Elementary)
        working-directory: real_estate_analysis
        run: |
          dbt deps
          dbt build --exclude package:dbt_project_evaluator

      - name: Republier la base
        if: always()
        run: gh release upload db-preprod real_estate_analysis/preprod.duckdb --clobber