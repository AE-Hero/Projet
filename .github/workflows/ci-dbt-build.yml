name: 🧪 CI - build

on:
  pull_request:
    branches: [main]
    paths:
      - "real_estate_analysis/**"
      - "requirements.txt"
      - ".github/workflows/ci-dbt-build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: dbt-ci-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DBT_PROFILES_DIR: .
  DBT_TARGET: ci

defaults:
  run:
    working-directory: real_estate_analysis

jobs:
  build:
    name: dbt build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt      # racine du repo

      - name: Install dependencies
        run: pip install -r ../requirements.txt        # l'étape s'exécute dans real_estate_analysis/

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (validation de la syntaxe et des refs)
        run: dbt parse

      - name: Download DVF data
        run: dbt run-operation load_dvf

      - name: dbt build (models + tests + seeds + snapshots)
        run: dbt build --exclude package:dbt_project_evaluator --fail-fast

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-ci
          path: |
            real_estate_analysis/target/manifest.json
            real_estate_analysis/target/run_results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Résumé du build
        if: always()
        run: |
          python ../.github/scripts/format-ci-dbt-build.py > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commentaire sur la PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dbt-build
          path: real_estate_analysis/summary.md