name: CI - dbt-project-evaluator

on:
  pull_request:
    branches: [main]
    paths:
      - "real_estate_analysis/**"
      - "requirements.txt"
      - ".github/workflows/ci-dbt-project-evaluator.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: dbt-ci-project-evaluator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DBT_PROFILES_DIR: .
  DBT_TARGET: ci

defaults:
  run:
    working-directory: real_estate_analysis

jobs:
  evaluate:
    name: dbt project evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt      # racine du repo

      - name: Install dependencies
        run: pip install -r ../requirements.txt        # l'étape s'exécute dans real_estate_analysis/

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        run: dbt parse

      - name: Run dbt project evaluator
        run: dbt build --target ci --select package:dbt_project_evaluator

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-project-evaluator
          path: |
            real_estate_analysis/target/manifest.json
            real_estate_analysis/target/run_results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Résumé de l'évaluation
        if: always()
        run: |
          python ../.github/scripts/format-ci-dbt-project-evaluator.py --db ci.duckdb > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commentaire sur la PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dbt-project-evaluator
          path: real_estate_analysis/summary.md