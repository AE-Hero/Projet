name: dbt CD deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
      - "requirements.txt"
      - ".github/workflows/cd-deploy-site.yml"
      - ".github/scripts/export_parquet.py"

  # Reconstruit le site après chaque déploiement preprod / prod
  workflow_run:
    workflows: ["dbt CD deploy preprod", "dbt CD deploy prod"]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DBT_PROFILES_DIR: .
  DBT_TARGET: prod
  EXPORT_SCHEMAS: ""          # vide = tous les schémas (hors raw*, _*)
  EXPORT_MAX_TABLE_MB: "100"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Un déploiement dbt en échec ne doit pas republier le site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs-requirements.txt
            requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt
          pip install -r requirements.txt

      # Bases et boards publiés par les CD preprod / prod.
      # Absents au tout premier run : on continue sans.
      - name: Download published DBs and boards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p real_estate_analysis/_downloads
          gh release download db-prod --pattern "prod.duckdb" \
            --dir real_estate_analysis --clobber || echo "Pas de base prod publiée."
          gh release download db-preprod --pattern "preprod.duckdb" \
            --dir real_estate_analysis/_downloads --clobber || echo "Pas de base preprod publiée."
          gh release download db-prod --pattern "charts-prod.tar.gz" \
            --dir real_estate_analysis/_downloads --clobber || true
          gh release download db-preprod --pattern "charts-preprod.tar.gz" \
            --dir real_estate_analysis/_downloads --clobber || true

      # La doc dbt a besoin de la base prod pour générer le catalogue
      - name: Generate dbt docs
        working-directory: real_estate_analysis
        run: |
          dbt deps
          if [ -f prod.duckdb ]; then
            dbt docs generate
          else
            echo "::warning::prod.duckdb absent, doc dbt non générée."
          fi

      - name: Build MkDocs site
        run: mkdocs build -d site

      - name: Assemble site
        run: |
          if [ -f real_estate_analysis/target/index.html ]; then
            mkdir -p site/dbt-docs
            cp real_estate_analysis/target/index.html \
               real_estate_analysis/target/manifest.json \
               real_estate_analysis/target/catalog.json site/dbt-docs/
          fi
          for env in prod preprod; do
            archive="real_estate_analysis/_downloads/charts-${env}.tar.gz"
            if [ -f "$archive" ]; then
              mkdir -p "site/charts/${env}"
              tar -xzf "$archive" -C "site/charts/${env}"
            fi
          done

      # Optionnel : Parquet pour l'explorateur web (DuckDB-WASM).
      # Ne bloque jamais le déploiement du site.
      - name: Export Parquet for browser explorer
        continue-on-error: true
        run: |
          if [ ! -f .github/scripts/export_parquet.py ]; then
            echo "export_parquet.py absent, explorateur ignoré."
            exit 0
          fi
          if [ -f real_estate_analysis/prod.duckdb ]; then
            python .github/scripts/export_parquet.py --env prod \
              --db real_estate_analysis/prod.duckdb --out site/data \
              --schemas "$EXPORT_SCHEMAS" --max-table-mb "$EXPORT_MAX_TABLE_MB"
          fi
          if [ -f real_estate_analysis/_downloads/preprod.duckdb ]; then
            python .github/scripts/export_parquet.py --env preprod \
              --db real_estate_analysis/_downloads/preprod.duckdb --out site/data \
              --schemas "$EXPORT_SCHEMAS" --max-table-mb "$EXPORT_MAX_TABLE_MB"
          fi
          size_mb=$(du -sm site | cut -f1)
          echo "Taille du site : ${size_mb} Mo"
          if [ "$size_mb" -gt 900 ]; then
            echo "::warning::Site de ${size_mb} Mo, proche de la limite GitHub Pages (1 Go)."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4