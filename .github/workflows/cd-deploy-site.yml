name: ⚙️ CD - Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
      - "requirements.txt"
      - ".github/workflows/cd-deploy-site.yml"
      - ".github/scripts/export_parquet.py"

  # Reconstruit le site après chaque déploiement preprod / prod
  workflow_run:
    workflows: ["dbt CD deploy preprod", "dbt CD deploy prod"]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .
  EXPORT_SCHEMAS: ""          # vide = tous les schémas (hors raw*, _*)
  EXPORT_MAX_TABLE_MB: "100"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs-requirements.txt
            requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt
          pip install -r requirements.txt

      # Bases et boards publiés par les CD preprod / prod.
      # Absents au tout premier run : on continue sans.
      - name: Download published DBs and boards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p real_estate_analysis/_downloads
          for env in prod preprod; do
            gh release download "db-${env}" --pattern "${env}.duckdb" \
              --dir real_estate_analysis --clobber || echo "Pas de base ${env} publiée."
            gh release download "db-${env}" --pattern "charts-${env}.tar.gz" \
              --dir real_estate_analysis/_downloads --clobber || true
          done

      # Un site complet par environnement (site/prod/ et site/preprod/) :
      # pages MkDocs, doc dbt, données Parquet de l'explorateur, dashboards.
      # La logique est dans .github/scripts/build_site.py
      - name: Build one site per environment
        env:
          DBT_PROFILES_DIR: .
        run: |
          python .github/scripts/cd-build-site.py \
            --repo "$GITHUB_REPOSITORY" \
            --schemas "$EXPORT_SCHEMAS" \
            --max-table-mb "$EXPORT_MAX_TABLE_MB"

      - uses: actions/configure-pages@v5
        if: github.event.repository.private == false

      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.private == false
        with:
          path: site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4