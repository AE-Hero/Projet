site_name: !ENV [SITE_NAME, "Projet fil rouge - Real Estate Analysis"]
site_description: Documentation du projet fil rouge AE Hero (dbt, DuckDB, DVF)
site_url: ""

docs_dir: !ENV [DOCS_DIR, docs]

# Une page = un fichier .html : évite la collision avec le dossier dbt-docs/
# publié par le workflow et garde des liens relatifs simples.
use_directory_urls: false

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Accueil: index.md
  - Dashboards: dashboards.md
  - Documentation dbt: dbt-docs.md
  - Explorateur SQL: explorer.md

extra_css:
  - stylesheets/explorer.css

extra_javascript:
  - path: javascripts/explorer.js
    type: module

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg