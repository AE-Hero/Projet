version: 2

models:
  - name: stg_dvf
    description: "Staging DVF - renommage et typage des colonnes brutes, 1 ligne = 1 lot de transaction"
    columns:
      - name: id_mutation
        description: "Identifiant unique de la mutation"
        tests:
          - not_null

      - name: numero_disposition
        description: "Numéro de disposition dans l'acte"

      - name: id_parcelle
        description: "Identifiant cadastral de la parcelle"

      - name: ancien_id_parcelle
        description: "Ancien identifiant cadastral si la parcelle a été modifiée"

      - name: date_mutation
        description: "Date de la transaction"
        tests:
          - not_null

      - name: annee_mutation
        description: "Année extraite de date_mutation"

      - name: mois_mutation
        description: "Mois extrait de date_mutation"

      - name: nature_mutation
        description: "Type d'acte : Vente, Vente en l'état futur d'achèvement, Adjudication..."

      - name: valeur_fonciere
        description: "Montant de la transaction en euros"

      - name: adresse_numero
        description: "Numéro dans la voie"

      - name: adresse_suffixe
        description: "Suffixe du numéro (bis, ter...)"

      - name: adresse_nom_voie
        description: "Nom de la voie"

      - name: adresse_code_voie
        description: "Code FANTOIR de la voie"

      - name: code_postal
        description: "Code postal"

      - name: code_commune
        description: "Code INSEE de la commune"

      - name: nom_commune
        description: "Nom de la commune"

      - name: code_departement
        description: "Code du département (01, 75, 2A...)"

      - name: ancien_code_commune
        description: "Ancien code INSEE si fusion de communes"

      - name: ancien_nom_commune
        description: "Ancien nom de commune si fusion"

      - name: longitude
        description: "Longitude WGS84 du bien"

      - name: latitude
        description: "Latitude WGS84 du bien"

      - name: numero_volume
        description: "Numéro de volume pour les lots en copropriété"

      - name: lot1_numero
        description: "Numéro du lot 1"

      - name: lot1_surface_carrez
        description: "Surface loi Carrez du lot 1 en m²"

      - name: lot2_numero
        description: "Numéro du lot 2"

      - name: lot2_surface_carrez
        description: "Surface loi Carrez du lot 2 en m²"

      - name: lot3_numero
        description: "Numéro du lot 3"

      - name: lot3_surface_carrez
        description: "Surface loi Carrez du lot 3 en m²"

      - name: lot4_numero
        description: "Numéro du lot 4"

      - name: lot4_surface_carrez
        description: "Surface loi Carrez du lot 4 en m²"

      - name: lot5_numero
        description: "Numéro du lot 5"

      - name: lot5_surface_carrez
        description: "Surface loi Carrez du lot 5 en m²"

      - name: nombre_lots
        description: "Nombre total de lots dans la transaction"

      - name: code_type_local
        description: "Code du type de bien (1=Maison, 2=Appartement, 3=Dépendance, 4=Local commercial)"

      - name: type_local
        description: "Libellé du type de bien"

      - name: surface_reelle_bati
        description: "Surface réelle du bâti en m²"

      - name: nombre_pieces_principales
        description: "Nombre de pièces principales"

      - name: code_nature_culture
        description: "Code de la nature de culture du terrain"

      - name: nature_culture
        description: "Libellé de la nature de culture (sols, prés, taillis...)"

      - name: code_nature_culture_speciale
        description: "Code de nature de culture spéciale"

      - name: nature_culture_speciale
        description: "Libellé de nature de culture spéciale"

      - name: surface_terrain
        description: "Surface du terrain en m²"