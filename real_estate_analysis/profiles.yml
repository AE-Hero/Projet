real_estate_analysis:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      threads: 4
      schema: main
      extensions:
        - parquet
        - httpfs
        - spatial
      settings:
        memory_limit: 4GB

    preprod:
      type: duckdb
      path: preprod.duckdb
      threads: 4
      schema: main
      extensions:
        - parquet
        - httpfs
        - spatial
      settings:
        memory_limit: 4GB

    prod:
      type: duckdb
      path: prod.duckdb
      threads: 4
      schema: main
      extensions:
        - parquet
        - httpfs
        - spatial
      settings:
        memory_limit: 4GB

    ci:
      type: duckdb
      path: ci.duckdb
      threads: 4
      schema: main
      extensions:
        - parquet
        - httpfs
        - spatial
      settings:
        memory_limit: 4GB

elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      threads: 4
      schema: main_elementary

    preprod:
      type: duckdb
      path: preprod.duckdb
      threads: 4
      schema: main_elementary

    prod:
      type: duckdb
      path: prod.duckdb
      threads: 4
      schema: main_elementary

    ci:
      type: duckdb
      path: ci.duckdb
      threads: 4
      schema: main_elementary